name: Windows build, test and release
on:
  push:
    tags: ['v*-windows']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.repository == 'rrrome/spherail_private'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      statuses: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Report build started
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=pending -f context=windows/release -f description="Building and testing Windows release" -f target_url="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --silent
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-build.txt
          npm.cmd ci
      - name: Test storage, maps, renderer and LAN matches
        run: |
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify_expansion.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_gameplay_sprites.py
      - name: Test the Windows desktop application
        timeout-minutes: 10
        run: npm.cmd run test:windows
      - name: Build Windows installers
        run: npm.cmd run build:windows
      - name: Test the packaged Windows application
        timeout-minutes: 10
        run: |
          $env:SPHERAIL_EXE = (Resolve-Path dist/win-unpacked/Spherail.exe).Path
          npm.cmd run test:windows
      - name: Test per-user install, installed app and uninstall
        timeout-minutes: 10
        run: ./scripts/test_windows_installer.ps1
      - name: Preserve test screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-test-screenshots
          path: test-results/
          if-no-files-found: ignore
      - name: Attach matching sources and checksums
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          git archive --format=zip --prefix="Spherail-$version-source/" --output="dist/Spherail-$version-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -match '^Spherail-.*\.(exe|zip)$' } | Sort-Object Name
          $lines = $files | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Publish private Windows release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version-windows") { throw 'Release tag does not match the game version' }
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '^Spherail-.*\.(exe|zip)$' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --title "Spherail v$version — Windows" --notes-file Windows/RELEASE_NOTES.md --verify-tag --latest
      - name: Report final build and release status
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          $state = if ($env:BUILD_RESULT -eq 'success') { 'success' } else { 'failure' }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=$state -f context=windows/release -f description="Windows build, tests and release: $state" -f target_url="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --silent
